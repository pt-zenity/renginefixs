name: Remove legacy reNgine source

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare verified SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_HOST_FINGERPRINT: ${{ vars.SSH_HOST_FINGERPRINT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          test -n "$SSH_HOST_FINGERPRINT"
          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$RUNNER_TEMP/production-host-key"
          actual=$(ssh-keygen -lf "$RUNNER_TEMP/production-host-key" -E sha256 | awk '{print $2}')
          test "$actual" = "$SSH_HOST_FINGERPRINT"
          cat "$RUNNER_TEMP/production-host-key" >> ~/.ssh/known_hosts

      - name: Verify backup and remove old source directory
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          ssh -o BatchMode=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE' | tee "$RUNNER_TEMP/cleanup.log"
          set -Eeuo pipefail
          legacy=/home/zenity/renginefixs
          backup=/home/zenity/backups/rengine2-20261003T015155Z
          test -d "$legacy/.git"
          test -s "$backup/db.dump"
          test -s "$backup/scan_results.tar.gz"
          test -s "$backup/legacy.env"
          test -z "$(sudo docker ps --filter label=com.docker.compose.project=rengine --format '{{.Names}}')"
          curl -fsS --connect-timeout 5 --max-time 10 --resolve 4sus.xyz:443:127.0.0.1 https://4sus.xyz/api/v1/health/health -o /dev/null
          git -C "$legacy" diff --binary > "$backup/source-changes.patch"
          sudo tar -czf "$backup/legacy-config.tar.gz" --ignore-failed-read -C "$legacy" .env secrets web/secret
          sudo chown zenity:zenity "$backup/legacy-config.tar.gz"
          chmod 600 "$backup/legacy-config.tar.gz" "$backup/source-changes.patch"
          sudo python3 -c 'import shutil; shutil.rmtree("/home/zenity/renginefixs")'
          test ! -e "$legacy"
          curl -fsS --connect-timeout 5 --max-time 10 --resolve 4sus.xyz:443:127.0.0.1 https://4sus.xyz/api/v1/health/health -o /dev/null
          echo CLEANUP_COMPLETE
          REMOTE
          grep -q '^CLEANUP_COMPLETE$' "$RUNNER_TEMP/cleanup.log"
