name: Production SSH check
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_HOST_FINGERPRINT: ${{ vars.SSH_HOST_FINGERPRINT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          test -n "$SSH_HOST_FINGERPRINT"
          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$RUNNER_TEMP/production-host-key"
          actual=$(ssh-keygen -lf "$RUNNER_TEMP/production-host-key" -E sha256 | awk '{print $2}')
          test "$actual" = "$SSH_HOST_FINGERPRINT"
          cat "$RUNNER_TEMP/production-host-key" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -e
          whoami
          pwd
          find /home/zenity -maxdepth 2 -type d -print
          . /etc/os-release
          echo "OS: $PRETTY_NAME"
          docker --version || true
          docker compose version || true
          if sudo -n true; then echo 'Sudo: yes'; else echo 'Sudo: no'; fi
          df -h /home/zenity
          sudo docker ps --format 'CONTAINER {{.Names}} PORTS {{.Ports}}'
          sudo ss -ltn | grep -E ':(443|8082|5432|8000|11434) ' || true
          REMOTE
